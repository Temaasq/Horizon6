name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android 34 platform & build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            if [ ! -f "$SDK_ROOT/platforms/android-34/android.jar" ] || [ ! -d "$SDK_ROOT/build-tools/34.0.0" ]; then
              "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
            fi
          fi
          ls -la "$SDK_ROOT/platforms/android-34/android.jar" "$SDK_ROOT/build-tools/34.0.0"

      - name: Run automated JS tests
        run: node --test tests/unit/*.test.js tests/e2e/*.test.js

      - name: Build & sign Android APK
        run: python3 scripts/build_apk.py --no-copy

      - name: Verify APK integrity & signature
        run: python3 scripts/verify_apk.py --apk horizon6_japan_3d.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon6_japan_3d_apk
          path: horizon6_japan_3d.apk

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Horizon 6: Япония 3D (${{ steps.meta.outputs.tag }})"
          files: horizon6_japan_3d.apk
          generate_release_notes: true
